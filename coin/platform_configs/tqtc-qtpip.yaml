Version: 2
Module only: True
Configurations:
-
    Id: 'win-on-x86_64'
    Template: 'qtci-windows-11_24H2-x86_64-73'
    Compiler: 'MSVC2022'
    Target arch: 'x86_64'
    Features: ['Packaging', 'UseConfigure', 'DisableTests']
    Configure arguments: '-opensource -confirm-license -nomake examples -nomake tests -accessibility -no-icu -static -release -no-sql-sqlite -openssl-linked -static-runtime'
    Environment variables: [
        'TARGET_ARCHITECTURE=x86_64',
        'PATH=%PATH%;%CI_JOM_PATH%;C:\Utils\gnuwin32\bin;',
        'LLVM_INSTALL_DIR=',
        'LLVM_INSTALL_DIR_msvc=',
        'QDOC_USE_STATIC_LIBCLANG=',
        'VCPKG_HOST_TRIPLET=x64-windows-qt',
        'VCPKG_TARGET_TRIPLET=x64-windows-qt',
        'INCLUDE={{.Env.ZLIB_PATH_AMD64}};{{.Env.XZ}}\src\liblzma\api;{{.Env.BZIP2}};{{.Env.INCLUDE}}',
        'LIB={{.Env.ZLIB_PATH_AMD64}};{{.Env.XZ}}\windows\vs2019\ReleaseMT\x64\liblzma;{{.Env.BZIP2}};{{.Env.LIB}}',
        'CMAKE_ARGS=-DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
        'NON_QTBASE_CMAKE_ARGS=-DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_VERSION_MINIMUM=3.5',
    ]
